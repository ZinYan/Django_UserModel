{% extends 'users/main.html' %}

{% block content %}
<div class="container mt-4">
    <h2>My Profile</h2>
    <img class="rounded-circle account-img" src="{{ user.profile.image.url }}">
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
</div>
{% endblock %}
